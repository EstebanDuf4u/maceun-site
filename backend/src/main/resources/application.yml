server:
  port: 8080
  forward-headers-strategy: framework   # derrière Nginx : récupère la vraie IP du client

spring:
  application:
    name: maceun-api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

maceun:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bandsintown:
    base-url: https://rest.bandsintown.com
    artist: ${BANDSINTOWN_ARTIST:DJ Maceun}
    app-id: ${BANDSINTOWN_APP_ID:0ee6368fd3652519a6a69a1065f0283d}
    cache-ttl: 10m
  booking:
    formspree-url: ${FORMSPREE_URL:https://formspree.io/f/xanwkaap}
    rate-limit:
      max-requests: 5
      window: 10m
