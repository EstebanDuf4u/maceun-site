server:
  port: 8080
  forward-headers-strategy: framework   # derrière Nginx : récupère la vraie IP du client
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}   # mettre true en production (HTTPS)

spring:
  application:
    name: maceun-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/maceun}
    username: ${DB_USER:maceun}
    password: ${DB_PASSWORD:maceun}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # le schéma est géré par Flyway (src/main/resources/db/migration)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

maceun:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:maceun}
    password: ${ADMIN_PASSWORD:}          # vide = admin désactivé
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  bandsintown:
    base-url: https://rest.bandsintown.com
    artist: ${BANDSINTOWN_ARTIST:DJ Maceun}
    app-id: ${BANDSINTOWN_APP_ID:0ee6368fd3652519a6a69a1065f0283d}
    cache-ttl: 10m
  releases:
    allowed-hosts: fanlink.tv, fanlink.to, toneden.io, hypeddit.com
    deezer-artist: ${DEEZER_ARTIST:DJ Maceun}
    sync-interval: 6h
    auto-sync: true
  booking:
    formspree-url: ${FORMSPREE_URL:https://formspree.io/f/xanwkaap}
    rate-limit:
      max-requests: 5
      window: 10m
