# /etc/nginx/sites-available/maceunofficiel.fr (installé par deploy/setup-server.sh).
# Le domaine passe par le proxy Cloudflare, qui contacte le serveur en HTTPS : ce bloc 443 est
# indispensable, sinon nginx répond avec le premier site HTTPS venu (rutrack).
# __CERT__ / __KEY__ : certificat auto-signé au départ, puis Let's Encrypt (certbot --webroot).

server {
    listen 80;
    listen [::]:80;
    server_name maceunofficiel.fr www.maceunofficiel.fr;

    # validation Let's Encrypt (renouvellement automatique par certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;       # nginx 1.24 sur le serveur : pas de directive « http2 on; »
    listen [::]:443 ssl http2;
    server_name maceunofficiel.fr www.maceunofficiel.fr;

    ssl_certificate __CERT__;
    ssl_certificate_key __KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    # photos envoyées depuis l'admin : 10 Mo max
    client_max_body_size 12m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
