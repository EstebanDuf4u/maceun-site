# /etc/nginx/sites-available/maceunofficiel.fr (installé par deploy/setup-server.sh).
# Le HTTPS est ajouté ensuite par certbot (`certbot --nginx`), comme pour rutrack.
server {
    listen 80;
    listen [::]:80;
    server_name maceunofficiel.fr www.maceunofficiel.fr;

    # photos envoyées depuis l'admin : 10 Mo max
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
