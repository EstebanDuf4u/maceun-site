server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API admin : envoi d'images jusqu'à 10 Mo
    location /api/admin/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;   # garde le port : sinon Spring voit une origine différente et bloque (CORS)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        client_max_body_size 12m;
    }

    # API Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;   # garde le port : sinon Spring voit une origine différente et bloque (CORS)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        client_max_body_size 64k;
    }

    # fichiers générés par Vite (nom avec hash) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # images envoyées depuis l'admin (stockées par le back)
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;   # garde le port : sinon Spring voit une origine différente et bloque (CORS)
    }

    # l'admin ne doit pas apparaître dans Google
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;   # servi ici même, sans redirection interne (sinon les en-têtes sont perdus)
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
